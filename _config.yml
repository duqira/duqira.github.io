# Site Settings
title: "PrinterTech Lab - 3D Printer Reviews & Guides"
description: "Expert reviews, comparisons, and buying guides for the top 3D printers. Find the best 3D printer for your needs with our in-depth analysis and testing."
url: "https://duqira.github.io"
baseurl: ""
language: "en"
timezone: Asia/Jakarta

# Author
author:
  name: "Tech Print Expert"
  bio: "3D printing enthusiast with 5+ years experience testing and reviewing 3D printers. Specializing in FDM, SLA, and desktop 3D printing technologies."
  email: "contact@duqira.github.io"

disclosure: "This article contains affiliate links. If you make a purchase through these links, I may earn a commission at no additional cost to you. I only recommend products I believe in."

# Build Settings
markdown: kramdown
permalink: /:title
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-archives

# Pagination
paginate: 12
paginate_path: "/page:num/"

# Archives (for categories & tags)
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name
    tag: /tags/:name

# Defaults
collections:
  pages:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: "_posts"
      type: "posts" 
    values:
      layout: "post"
  - scope:
      path: "_pages"
      type: "pages" 
    values:
      layout: "page"

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - .git
  - .gitignore

jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/